[tox]
envlist =
    py310,py311,py312,py313,py314,pypy3,
    coverage,
    docs
isolated_build = True

[testenv]
commands =
    python --version
    pytest {posargs:}
extras =
    testing
setenv =
    COVERAGE_FILE=.coverage.{envname}

[testenv:coverage]
commands =
    coverage combine
    coverage report
deps =
    coverage
setenv =
    COVERAGE_FILE=.coverage

[testenv:docs]
allowlist_externals = make
commands =
    make -C docs html epub BUILDDIR={envdir}
extras =
    docs

[testenv:lint]
skip_install = True
commands =
    ruff check .
    ruff format --check .
    check-manifest
    # build sdist/wheel
    python -m build .
    twine check dist/*
deps =
    build
    check-manifest
    readme_renderer
    ruff
    twine

[testenv:format]
skip_install = true
commands =
    ruff check --fix .
    ruff format .
deps =
    ruff

[testenv:build]
skip_install = True
commands =
    # clean up build/ and dist/ folders
    python -c 'import shutil; shutil.rmtree("build", ignore_errors=True)'
    # Make sure we aren't forgetting anything
    check-manifest
    # build sdist/wheel
    python -m build .
    # Verify all is well
    twine check dist/*
deps =
    build
    check-manifest
    readme_renderer
    twine
